<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiview 6 (Mobile Optimized)</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* 전체 레이아웃 */
.container {
    display: flex;
    flex-wrap: wrap;
}

/* 영상 영역 */
.video-wrapper {
    width: 50%; /* 핵심: 2열 */
    padding: 2px;
    box-sizing: border-box;
}

.video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
}

.video-container iframe {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* 시청자 수 */
.text-box {
    text-align: center;
    font-size: 14px;
    background: #f0f0f0;
    padding: 4px;
}

/* 그래프 영역 */
.chart-container {
    width: 100%;
    height: 250px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">

<!-- 6개 영상 -->
<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/NJUjU9ALj4A?autoplay=1&mute=1" allowfullscreen></iframe>
    </div>
    <div class="text-box" id="v1"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/lb1oB2feqkQ?autoplay=1&mute=1" allowfullscreen></iframe>
    </div>
    <div class="text-box" id="v2"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/yhpbioCP6nA?autoplay=1&mute=1" allowfullscreen></iframe>
    </div>
    <div class="text-box" id="v3"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/s9xL1DpBsfQ?autoplay=1&mute=1" allowfullscreen></iframe>
    </div>
    <div class="text-box" id="v4"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/5cFoz90FUMk?autoplay=1&mute=1" allowfullscreen></iframe>
    </div>
    <div class="text-box" id="v5"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/w05Ejc0iOVI?autoplay=1&mute=1" allowfullscreen></iframe>
    </div>
    <div class="text-box" id="v6"></div>
</div>

</div>

<!-- 그래프 -->
<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>
const apiKey = 'AIzaSyD5VgaH9IPJteplU0ynPb9WvjmJPODEW0E';

const videoIds = [
    'NJUjU9ALj4A',
    'lb1oB2feqkQ',
    'yhpbioCP6nA',
    's9xL1DpBsfQ',
    '5cFoz90FUMk',
    'w05Ejc0iOVI'
];

const names = [
    '한국경제TV',
    'MTN',
    '연합뉴스경제',
    '매일경제TV',
    '이데일리TV',
    '토마토증권통'
];

/* 그래프 데이터 */
const labels = [];
const dataSets = videoIds.map(() => []);

/* 차트 생성 */
const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: [
            { label: names[0], data: dataSets[0], borderColor:'#e41a1c' },
            { label: names[1], data: dataSets[1], borderColor:'#377eb8' },
            { label: names[2], data: dataSets[2], borderColor:'#4daf4a' },
            { label: names[3], data: dataSets[3], borderColor:'#984ea3' },
            { label: names[4], data: dataSets[4], borderColor:'#ff7f00' },
            { label: names[5], data: dataSets[5], borderColor:'#f1c40f' }
        ]
    },
    options: {
        responsive: true,
        animation: false,
        elements: {
            point: { radius: 2 }
        },
        plugins: {
            legend: { position: 'bottom' }
        },
        scales: {
            y: { beginAtZero: true }
        }
    }
});

/* 데이터 가져오기 */
async function update() {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoIds.join(',')}&key=${apiKey}`);
    const data = await res.json();

    const now = new Date().toLocaleTimeString();

    labels.push(now);

    data.items.forEach((item, i) => {
        const viewers = item.liveStreamingDetails?.concurrentViewers || 0;

        document.getElementById('v' + (i+1)).innerText =
            `${names[i]} : ${Number(viewers).toLocaleString()}명`;

        dataSets[i].push(viewers);
    });

    /* 데이터 길이 제한 */
    if (labels.length > 20) {
        labels.shift();
        dataSets.forEach(arr => arr.shift());
    }

    chart.update();
}

update();
setInterval(update, 20000);
</script>

</body>
</html>
