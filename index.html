<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --gap: 12px;
      --chat-height: 420px;

      --bg: #0b0b0b;
      --panel: #141414;
      --border: #232323;
      --text: #eeeeee;

      --green: #62e98b;
      --blue: #4d8cff;
      --orange: #ff934d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        system-ui,
        -apple-system,
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }


    /* =====================================================
       전체 3열
    ====================================================== */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(320px, 1fr));

      gap: var(--gap);
      padding: var(--gap);
    }


    .tile {
      background: var(--panel);

      border:
        1px solid var(--border);

      border-radius: 12px;

      overflow: hidden;

      min-width: 0;
    }


    /* =====================================================
       영상
    ====================================================== */

    .video-container {
      position: relative;

      padding-bottom: 56.25%;

      height: 0;

      background: #000;
    }


    .video-container iframe {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }


    /* =====================================================
       채널명 / 동접자
    ====================================================== */

    .meta {
      padding:
        8px
        12px
        5px
        12px;

      min-height: 44px;
    }


    .meta-row {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      min-height: 32px;
    }


    .name-line {
      font-weight: 700;

      color: #fff;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-align: center;

      padding: 0 80px;
    }


    .name-line .count {
      font-weight: 700;

      color: #b7f397;
    }


    /* =====================================================
       Graph 버튼
       한국경제TV에만 존재
    ====================================================== */

    .graph-button {
      position: absolute;

      right: 0;

      top: 50%;

      transform:
        translateY(-50%);

      border: 0;

      border-radius: 8px;

      padding:
        7px
        14px;

      background: #2468e8;

      color: #fff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.15s;
    }


    .graph-button:hover {
      background: #3479fa;
    }


    .graph-button:active {
      transform:
        translateY(-50%)
        scale(0.97);
    }


    /* =====================================================
       채팅
    ====================================================== */

    .chat {
      padding:
        8px
        12px
        12px
        12px;
    }


    .chat iframe {
      width: 100%;

      height:
        var(--chat-height);

      border:
        1px solid var(--border);

      border-radius: 8px;

      background: var(--bg);
    }


    /* =====================================================
       그래프 영역
    ====================================================== */

    .graph-area {
      display: none;

      /*
        왼쪽 1/3:
        한국경제TV 단독 그래프

        오른쪽 2/3:
        3개 채널 통합 그래프
      */

      grid-template-columns:
        1fr 2fr;

      gap: var(--gap);

      padding:
        0
        var(--gap)
        8px
        var(--gap);
    }


    .graph-card {
      background: #101418;

      border:
        1px solid #303942;

      border-radius: 12px;

      padding:
        10px
        14px;

      min-width: 0;
    }


    .graph-title-row {
      display: flex;

      align-items: center;

      justify-content:
        flex-start;

      gap: 12px;

      margin-bottom: 4px;
    }


    .graph-title {
      font-size: 16px;

      font-weight: 700;

      color: #fff;
    }


    /* =====================================================
       그래프 높이

       최소 280px
       기준 34vh
       최대 360px
    ====================================================== */

    .graph-canvas-box {
      position: relative;

      height:
        clamp(
          280px,
          34vh,
          360px
        );
    }


    .graph-canvas-box canvas {
      width: 100% !important;

      height: 100% !important;
    }


    .graph-footer {
      padding-top: 4px;

      font-size: 12px;

      color: #9ca7b2;

      text-align: right;
    }


    /* =====================================================
       Graph 모드
    ====================================================== */

    body.graph-mode .chat {
      display: none;
    }


    body.graph-mode .graph-area {
      display: grid;
    }


    /* =====================================================
       반응형
    ====================================================== */

    @media (max-width: 1000px) {

      .grid {
        grid-template-columns:
          1fr;
      }


      .graph-area {
        grid-template-columns:
          1fr;
      }


      .name-line {
        padding: 0 75px;
      }


      .graph-canvas-box {
        height: 280px;
      }
    }

  </style>
</head>

<script>


/* =====================================================
   기본 설정
====================================================== */

const VIDEO_IDS = [

  'VlaCnp1fxI8',

  'lb1oB2feqkQ',

  's9xL1DpBsfQ'

];


const CHANNEL_NAMES = [

  '한국경제TV',

  'MTN',

  '매일경제TV'

];



/* =====================================================
   YouTube API Key
====================================================== */

const API_KEY =
  'AIzaSyB8u0gmJgBgGM9K1W-hF_q1GpOh8uwZw3w';



/* =====================================================
   데이터 수집 설정
====================================================== */


/* 20초 */

const UPDATE_INTERVAL =
  20000;


/* 최근 1시간 */

const HISTORY_DURATION =
  60 * 60 * 1000;


/* 20초 × 180 = 1시간 */

const MAX_POINTS =
  180;



/* =====================================================
   그래프 데이터
====================================================== */

const historyData = [

  [],

  [],

  []

];


let graphMode =
  false;


let hankyungChart =
  null;


let combinedChart =
  null;



/* =====================================================
   한국경제TV 단독 그래프 Y축 범위

   최초 동접자 기준 ±1,000명 설정.

   이후 기존 범위 안에서는 고정.

   기존 범위를 벗어난 경우에만
   새로운 현재 동접자 기준 ±1,000명으로 재설정.
====================================================== */

let hankyungYMin =
  null;


let hankyungYMax =
  null;



/* =====================================================
   시작
====================================================== */

document.addEventListener(

  'DOMContentLoaded',

  () => {


    setupChat();


    setupGraphButton();


    createCharts();



    /*
      페이지가 열리는 순간부터
      동접자 데이터 수집 시작.

      채팅창을 보고 있는 동안에도
      그래프 데이터는 계속 누적된다.
    */

    updateViewers();


    setInterval(

      updateViewers,

      UPDATE_INTERVAL

    );


  }

);



/* =====================================================
   YouTube 채팅
====================================================== */

function setupChat() {


  const domain =

    location.hostname ||
    'localhost';



  const chatIframes = [

    document.getElementById('chat1'),

    document.getElementById('chat2'),

    document.getElementById('chat3')

  ];



  VIDEO_IDS.forEach(

    (vid, i) => {


      chatIframes[i].src =

        `https://www.youtube.com/live_chat?v=${vid}` +

        `&embed_domain=${domain}` +

        `&dark_theme=1`;


    }

  );

}



/* =====================================================
   Graph / 채팅창 전환 버튼
====================================================== */

function setupGraphButton() {


  const button =

    document.getElementById(
      'graphToggleBtn'
    );



  button.addEventListener(

    'click',

    () => {


      graphMode =
        !graphMode;



      /* =============================
         그래프 모드
      ============================== */

      if (graphMode) {


        document.body.classList.add(
          'graph-mode'
        );


        button.textContent =
          '채팅창';



        /*
          그래프가 display:none 상태에서
          만들어졌으므로

          화면에 표시된 후
          크기를 다시 계산한다.
        */

        setTimeout(

          () => {


            if (hankyungChart) {

              hankyungChart.resize();

            }


            if (combinedChart) {

              combinedChart.resize();

            }


            refreshCharts();


          },

          50

        );


      }



      /* =============================
         채팅 모드
      ============================== */

      else {


        document.body.classList.remove(
          'graph-mode'
        );


        button.textContent =
          'Graph';


      }


    }

  );

}



/* =====================================================
   YouTube 동접자 API
====================================================== */

async function updateViewers() {


  const endpoint =

    `https://www.googleapis.com/youtube/v3/videos` +

    `?part=liveStreamingDetails` +

    `&id=${VIDEO_IDS.join(',')}` +

    `&key=${API_KEY}`;



  try {


    const response =

      await fetch(endpoint);



    if (!response.ok) {


      throw new Error(

        `HTTP ${response.status}`

      );


    }



    const data =

      await response.json();



    const viewerMap = {};



    (data.items || []).forEach(

      item => {


        const raw =

          item
            ?.liveStreamingDetails
            ?.concurrentViewers;



        /*
          정상적인 동접자 값이 있을 때만 저장.

          API에서 값이 순간적으로 누락될 경우
          0명으로 바꾸지 않고 기존 값을 유지한다.
        */

        if (

          raw !== undefined &&

          raw !== null

        ) {


          viewerMap[item.id] =

            Number(raw);


        }


      }

    );



    const now =

      new Date();



    VIDEO_IDS.forEach(

      (vid, index) => {


        /*
          이번 API 응답에
          해당 채널 값이 없으면
          기존 표시값 유지.
        */

        if (

          viewerMap[vid] ===
          undefined

        ) {


          return;


        }



        const viewers =

          viewerMap[vid];



        updateViewerText(

          index,

          viewers

        );



        addHistoryPoint(

          index,

          now,

          viewers

        );


      }

    );



    /*
      Graph 화면이 닫혀 있어도
      데이터와 그래프는 계속 갱신된다.
    */

    refreshCharts();


  }


  catch (error) {


    console.error(

      '동접자 집계 오류:',

      error

    );


  }

}



/* =====================================================
   상단 동접자 숫자
====================================================== */

function updateViewerText(

  index,

  viewers

) {


  const el =

    document.getElementById(

      `viewers${index + 1}`

    );



  if (!el) {

    return;

  }



  el.textContent =

    viewers.toLocaleString(
      'ko-KR'
    );

}



/* =====================================================
   그래프 데이터 저장
====================================================== */

function addHistoryPoint(

  channelIndex,

  time,

  value

) {


  const list =

    historyData[
      channelIndex
    ];



  list.push({

    time: time,

    value: value

  });



  /* =============================
     최근 1시간보다 오래된 데이터 제거
  ============================== */

  const cutoff =

    time.getTime() -

    HISTORY_DURATION;



  while (

    list.length > 0 &&

    list[0]
      .time
      .getTime() < cutoff

  ) {


    list.shift();


  }



  /* =============================
     최대 180개 데이터
  ============================== */

  while (

    list.length >
    MAX_POINTS

  ) {


    list.shift();


  }

}



/* =====================================================
   시간 표시
====================================================== */

function formatTime(date) {


  return date.toLocaleTimeString(

    'ko-KR',

    {

      hour:
        '2-digit',

      minute:
        '2-digit',

      second:
        '2-digit',

      hour12:
        false

    }

  );

}



/* =====================================================
   Chart.js 공통 설정
====================================================== */

function getCommonChartOptions() {


  return {


    responsive:
      true,


    maintainAspectRatio:
      false,


    animation:
      false,


    interaction: {

      mode:
        'index',

      intersect:
        false

    },


    plugins: {


      legend: {

        labels: {

          color:
            '#dddddd',

          usePointStyle:
            true,

          boxWidth:
            8

        }

      },


      tooltip: {


        callbacks: {


          label:
            function(context) {


              const value =

                context.parsed.y ??
                0;


              return (

                `${context.dataset.label}: ` +

                `${value.toLocaleString('ko-KR')}명`

              );


            }


        }


      }


    },


    scales: {


      x: {


        ticks: {

          color:
            '#aaaaaa',

          maxTicksLimit:
            7

        },


        grid: {

          color:
            'rgba(255,255,255,0.07)'

        },


        title: {

          display:
            true,

          text:
            '시간',

          color:
            '#bbbbbb'

        }


      },


      y: {


        ticks: {


          color:
            '#aaaaaa',


          callback:
            function(value) {


              return Number(value)
                .toLocaleString(
                  'ko-KR'
                );


            }


        },


        grid: {

          color:
            'rgba(255,255,255,0.08)'

        },


        title: {

          display:
            true,

          text:
            '동접자 수',

          color:
            '#bbbbbb'

        }


      }


    }


  };

}

/* =====================================================
   한국경제TV 단독 그래프 Y축 제어

   최초 동접자 기준 ±1,000명 설정.

   예:
   최초 6,200명
   → 5,200 ~ 7,200


   이후:

   6,300 → 기존 범위 유지
   6,900 → 기존 범위 유지
   7,100 → 기존 범위 유지


   7,201처럼 기존 상한을 넘거나
   5,199처럼 기존 하한 아래로 내려갈 때만

   새로운 현재값 기준 ±1,000명으로 재설정.
====================================================== */

function updateHankyungYAxis(

  current

) {


  /* =============================
     최초 설정
  ============================== */

  if (

    hankyungYMin === null ||

    hankyungYMax === null

  ) {


    hankyungYMin =

      Math.max(

        0,

        current - 1000

      );



    hankyungYMax =

      current + 1000;



    return;

  }



  /* =============================
     기존 범위를 벗어난 경우만
     새로운 ±1,000 범위 설정
  ============================== */

  if (

    current < hankyungYMin ||

    current > hankyungYMax

  ) {


    hankyungYMin =

      Math.max(

        0,

        current - 1000

      );



    hankyungYMax =

      current + 1000;


  }

}



/* =====================================================
   한국경제TV 단독 그래프 갱신
====================================================== */

function refreshHankyungChart() {


  const list =

    historyData[0];



  if (

    list.length === 0

  ) {


    return;


  }



  /* 가장 최근 동접자 */

  const current =

    list[
      list.length - 1
    ].value;



  /*
    Y축 범위 검사.

    최초 한 번 설정한 후
    기존 범위를 벗어날 때만 변경된다.
  */

  updateHankyungYAxis(

    current

  );



  /* =============================
     X축 시간
  ============================== */

  hankyungChart
    .data
    .labels =

      list.map(

        item =>
          formatTime(
            item.time
          )

      );



  /* =============================
     동접자 데이터
  ============================== */

  hankyungChart
    .data
    .datasets[0]
    .data =

      list.map(

        item =>
          item.value

      );



  /* =============================
     고정 Y축 적용
  ============================== */

  hankyungChart
    .options
    .scales
    .y
    .min =

      hankyungYMin;



  hankyungChart
    .options
    .scales
    .y
    .max =

      hankyungYMax;



  hankyungChart.update(

    'none'

  );

}



/* =====================================================
   3개 채널 통합 그래프
====================================================== */

function refreshCombinedChart() {


  /*
    세 채널을 한 번의 API 호출에서
    동시에 조회하므로

    한국경제TV 데이터 시간을
    공통 X축으로 사용한다.
  */

  const base =

    historyData[0];



  if (

    base.length === 0

  ) {


    return;


  }



  /* =============================
     X축 시간
  ============================== */

  combinedChart
    .data
    .labels =

      base.map(

        item =>
          formatTime(
            item.time
          )

      );



  /* =============================
     한국경제TV
  ============================== */

  combinedChart
    .data
    .datasets[0]
    .data =

      historyData[0]
        .map(

          item =>
            item.value

        );



  /* =============================
     MTN
  ============================== */

  combinedChart
    .data
    .datasets[1]
    .data =

      historyData[1]
        .map(

          item =>
            item.value

        );



  /* =============================
     매일경제TV
  ============================== */

  combinedChart
    .data
    .datasets[2]
    .data =

      historyData[2]
        .map(

          item =>
            item.value

        );



  /*
    통합 그래프의 Y축은
    세 채널 동접자에 맞춰 자동 조정.
  */

  delete combinedChart
    .options
    .scales
    .y
    .min;



  delete combinedChart
    .options
    .scales
    .y
    .max;



  combinedChart.update(

    'none'

  );

}
