<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiview 6 + 10분 그래프</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
}

.container {
    display: flex;
    flex-wrap: wrap;
}

/* 2x3 핵심 */
.video-wrapper {
    width: 50%;
    padding: 2px;
    box-sizing: border-box;
}

.video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
}

.video-container iframe {
    position: absolute;
    width: 100%;
    height: 100%;
}

.text-box {
    text-align: center;
    font-size: 14px;
    background: #f0f0f0;
    padding: 4px;
}

/* 그래프 */
.chart-container {
    width: 100%;
    height: 260px;
    padding: 10px;
}
</style>
</head>

<body>

<div class="container">

<!-- 6개 영상 -->
<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/NJUjU9ALj4A?autoplay=1&mute=1"></iframe>
    </div>
    <div class="text-box" id="v1"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/lb1oB2feqkQ?autoplay=1&mute=1"></iframe>
    </div>
    <div class="text-box" id="v2"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/yhpbioCP6nA?autoplay=1&mute=1"></iframe>
    </div>
    <div class="text-box" id="v3"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/s9xL1DpBsfQ?autoplay=1&mute=1"></iframe>
    </div>
    <div class="text-box" id="v4"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/5cFoz90FUMk?autoplay=1&mute=1"></iframe>
    </div>
    <div class="text-box" id="v5"></div>
</div>

<div class="video-wrapper">
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/w05Ejc0iOVI?autoplay=1&mute=1"></iframe>
    </div>
    <div class="text-box" id="v6"></div>
</div>

</div>

<!-- 그래프 -->
<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>
const apiKey = "YOUR_API_KEY";

/* 영상 정보 */
const videoIds = [
    'NJUjU9ALj4A',
    'lb1oB2feqkQ',
    'yhpbioCP6nA',
    's9xL1DpBsfQ',
    '5cFoz90FUMk',
    'w05Ejc0iOVI'
];

const names = [
    '한국경제TV',
    'MTN',
    '연합뉴스경제',
    '매일경제TV',
    '이데일리TV',
    '토마토증권통'
];

/* 색상 */
const colors = [
    '#e41a1c',
    '#377eb8',
    '#4daf4a',
    '#984ea3',
    '#ff7f00',
    '#f1c40f'
];

/* 그래프 데이터 */
const labels = [];
const dataSets = videoIds.map(() => []);

/* 시작시간 */
const startTime = Date.now();

/* 10분 유지 (20초 간격 → 30개) */
const MAX_POINTS = 30;

/* 차트 생성 */
const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
        labels: labels,
        datasets: names.map((name, i) => ({
            label: name,
            data: dataSets[i],
            borderColor: colors[i],
            borderWidth: 2,
            tension: 0.3,
            pointRadius: 2
        }))
    },
    options: {
        responsive: true,
        animation: false,
        plugins: {
            legend: { position: 'bottom' }
        },
        scales: {
            y: { beginAtZero: true }
        }
    }
});

/* 시간 포맷 */
function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
}

/* 업데이트 */
async function update() {

    const res = await fetch(
        `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoIds.join(',')}&key=${apiKey}`
    );

    const data = await res.json();

    const elapsedSec = Math.floor((Date.now() - startTime) / 1000);

    /* X축 (경과시간) */
    labels.push(formatTime(elapsedSec));

    data.items.forEach((item, i) => {
        const viewers = item.liveStreamingDetails?.concurrentViewers || 0;

        document.getElementById('v' + (i+1)).innerText =
            `${names[i]} : ${Number(viewers).toLocaleString()}명`;

        dataSets[i].push(viewers);
    });

    /* 10분 유지 */
    if (labels.length > MAX_POINTS) {
        labels.shift();
        dataSets.forEach(arr => arr.shift());
    }

    chart.update();
}

/* 실행 */
update();
setInterval(update, 20000);

</script>

</body>
</html>
