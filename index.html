<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>3 YouTube Views + Viewers + Live Chat + Graph</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    :root {
      --gap: 12px;
      --chat-height: 420px;

      --bg: #0b0b0b;
      --panel: #141414;
      --border: #232323;

      --text: #eeeeee;

      --green: #62e98b;
      --blue: #4d8cff;
      --orange: #ff934d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        system-ui,
        -apple-system,
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }


    /* =====================================================
       전체 3열
    ====================================================== */

    .grid {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(320px, 1fr));

      gap: var(--gap);

      padding: var(--gap);
    }


    .tile {

      background: var(--panel);

      border:
        1px solid var(--border);

      border-radius: 12px;

      overflow: hidden;

      min-width: 0;
    }


    /* =====================================================
       영상
    ====================================================== */

    .video-container {

      position: relative;

      padding-bottom: 56.25%;

      height: 0;

      background: #000;
    }


    .video-container iframe {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: 0;
    }


    /* =====================================================
       채널명 / 동접자
    ====================================================== */

    .meta {

      padding:
        8px
        12px
        5px
        12px;

      min-height: 44px;
    }


    .meta-row {

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 32px;
    }


    .name-line {

      font-weight: 700;

      color: #fff;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      text-align: center;

      padding: 0 80px;
    }


    .name-line .count {

      font-weight: 700;

      color: #b7f397;
    }


    /* =====================================================
       Graph 버튼
       한국경제TV에만 존재
    ====================================================== */

    .graph-button {

      position: absolute;

      right: 0;

      top: 50%;

      transform:
        translateY(-50%);

      border: 0;

      border-radius: 8px;

      padding:
        7px
        14px;

      background: #2468e8;

      color: #fff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.15s;
    }


    .graph-button:hover {

      background: #3479fa;
    }


    .graph-button:active {

      transform:
        translateY(-50%)
        scale(0.97);
    }


    /* =====================================================
       채팅
    ====================================================== */

    .chat {

      padding:
        8px
        12px
        12px
        12px;
    }


    .chat iframe {

      width: 100%;

      height:
        var(--chat-height);

      border:
        1px solid var(--border);

      border-radius: 8px;

      background: var(--bg);
    }


    /* =====================================================
       그래프 전체 영역
    ====================================================== */

    .graph-area {

      display: none;

      /*
        왼쪽 1/3
        오른쪽 2/3
      */

      grid-template-columns:
        1fr 2fr;

      gap: var(--gap);

      padding:
        0
        var(--gap)
        8px
        var(--gap);
    }


    /* =====================================================
       그래프 카드

       기존보다 상하 여백 감소
    ====================================================== */

    .graph-card {

      background: #101418;

      border:
        1px solid #303942;

      border-radius: 12px;

      padding:
        10px
        14px;

      min-width: 0;
    }


    .graph-title-row {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      margin-bottom: 4px;
    }


    .graph-title {

      font-size: 16px;

      font-weight: 700;

      color: #fff;
    }


    .graph-current {

      color: var(--green);

      font-size: 14px;

      font-weight: 700;

      white-space: nowrap;
    }


    /* =====================================================
       그래프 높이

       ★ 수정 핵심 ★

       기존:
       height: 420px;

       변경:
       브라우저 높이에 따라 자동 조절

       최소 230px
       기본 28vh
       최대 300px
    ====================================================== */

    .graph-canvas-box {

      position: relative;

      height:
        clamp(
          230px,
          28vh,
          300px
        );
    }


    .graph-canvas-box canvas {

      width: 100% !important;

      height: 100% !important;
    }


    .graph-footer {

      padding-top: 4px;

      font-size: 12px;

      color: #9ca7b2;

      text-align: right;
    }


    /* =====================================================
       Graph 모드
    ====================================================== */

    body.graph-mode .chat {

      display: none;
    }


    body.graph-mode .graph-area {

      display: grid;
    }


    /* =====================================================
       반응형
    ====================================================== */

    @media (max-width: 1000px) {

      .grid {

        grid-template-columns:
          1fr;
      }


      .graph-area {

        grid-template-columns:
          1fr;
      }


      .name-line {

        padding: 0 75px;
      }


      .graph-canvas-box {

        height: 280px;
      }

    }

  </style>
</head>


<body>


<!-- =====================================================
     영상 영역
====================================================== -->

<div class="grid">

  <div class="tile">

    <div class="video-container">

        allow="
          autoplay;
          encrypted-media;
          picture-in-picture
        "

        allowfullscreen

        title="MTN">
      </iframe>

    </div>


    <div class="meta">

      <div class="meta-row">

        <div class="name-line">

          MTN:

          <span

          </span>명

      </div>

    <div class="chat">

        id="chat2"

  </div>



  <!-- ===================================================
       매일경제TV
  ==================================================== -->

  <div class="tile">

    <div class="video-container">

      <iframe
        id="video3"

        src="https://www.youtube.com/embed/s9xL1DpBsfQ?autoplay=1&mute=1&rel=0"

        allow="
          autoplay;
          encrypted-media;
          picture-in-picture
        "

        allowfullscreen

        title="매일경제TV">
      </iframe>

    </div>


    <div class="meta">

      <div class="meta-row">

        <div class="name-line">

          매일경제TV:

          <span
            id="viewers3"
            class="count">

            0

          </span>명

        </div>

      </div>

    </div>


    <div class="chat">

      <iframe
        id="chat3"
        title="매일경제TV 채팅">
      </iframe>

    </div>

  </div>

</div>



<!-- =====================================================
     그래프 영역

     왼쪽:
     한국경제TV 단독 그래프

     오른쪽:
     MTN + 매일경제TV 영역을 합친
     3채널 통합 그래프
====================================================== -->

<div
  id="graphArea"
  class="graph-area">


  <!-- ===================================================
       한국경제TV 단독
  ==================================================== -->

  <div class="graph-card">


    <div class="graph-title-row">


      <div class="graph-title">

        한국경제TV 실시간 동접자

        <span
          style="
            font-size:12px;
            color:#9ca7b2;
          ">

          (최근 1시간)

        </span>

      </div>


      <div
        id="hankyungCurrent"
        class="graph-current">

        현재 0명

      </div>


    </div>



    <div class="graph-canvas-box">

      <canvas
        id="hankyungChart">
      </canvas>

    </div>


    <div class="graph-footer">

      현재 동접자 기준 ±1,000명
      · 20초마다 업데이트

  </div>



  <!-- ===================================================
       3채널 통합
  ==================================================== -->

  <div class="graph-card">


    <div class="graph-title-row">


      <div class="graph-title">

        3개 채널 통합 실시간 동접자

        <span
          style="
            font-size:12px;
            color:#9ca7b2;
          ">

          (최근 1시간)

        </span>

    </div>



    <div class="graph-canvas-box">

      <canvas
        id="combinedChart">
      </canvas>

    </div>


    <div class="graph-footer">

      최근 1시간
      · 최대 180개 데이터
      · 20초마다 업데이트

    </div>


  </div>


</div>



<script>


/* =====================================================
   기본 설정
====================================================== */

const VIDEO_IDS = [

  'VlaCnp1fxI8',

  'lb1oB2feqkQ',

  's9xL1DpBsfQ'

];


const CHANNEL_NAMES = [

  '한국경제TV',

  'MTN',

  '매일경제TV'

];



/* =====================================================
   YouTube API Key

   ※ 실제 운영 시 Google Cloud Console에서
      HTTP Referrer 제한 권장
====================================================== */

const API_KEY =
  'AIzaSyB8u0gmJgBgGM9K1W-hF_q1GpOh8uwZw3w';



/* =====================================================
   데이터 수집 설정
====================================================== */


/* 20초 */

const UPDATE_INTERVAL =
  20000;


/* 최근 1시간 */

const HISTORY_DURATION =
  60 * 60 * 1000;


/* 20초 × 180 = 1시간 */

const MAX_POINTS =
  180;



/* =====================================================
   채널별 그래프 데이터
====================================================== */

const historyData = [

  [],

  [],

  []

];


let graphMode =
  false;


let hankyungChart =
  null;


let combinedChart =
  null;



/* =====================================================
   시작
====================================================== */

document.addEventListener(

  'DOMContentLoaded',

  () => {


    setupChat();


    setupGraphButton();


    createCharts();



    /*
      페이지가 열린 순간부터
      동접자 데이터 수집 시작

      채팅창을 보고 있어도
      그래프 데이터는 계속 축적
    */

    updateViewers();


    setInterval(

      updateViewers,

      UPDATE_INTERVAL

    );


  }

);



/* =====================================================
   YouTube 채팅
====================================================== */

function setupChat() {


  const domain =

    location.hostname ||
    'localhost';



  const chatIframes = [

    document.getElementById('chat1'),

    document.getElementById('chat2'),

    document.getElementById('chat3')

  ];



  VIDEO_IDS.forEach(

    (vid, i) => {


      chatIframes[i].src =

        `https://www.youtube.com/live_chat?v=${vid}` +

        `&embed_domain=${domain}` +

        `&dark_theme=1`;


    }

  );

}



/* =====================================================
   Graph / 채팅창 버튼
====================================================== */

function setupGraphButton() {


  const button =

    document.getElementById(
      'graphToggleBtn'
    );



  button.addEventListener(

    'click',

    () => {


      graphMode =
        !graphMode;



      /* =============================
         그래프 모드
      ============================== */

      if (graphMode) {


        document.body.classList.add(
          'graph-mode'
        );


        button.textContent =
          '채팅창';



        /*
          그래프 영역이 display:none 상태에서
          생성되어 있었기 때문에

          화면에 나타난 후
          Chart.js 크기 재계산
        */

        setTimeout(

          () => {


            if (hankyungChart) {

              hankyungChart.resize();

            }


            if (combinedChart) {

              combinedChart.resize();

            }


            refreshCharts();


          },

          50

        );


      }


      /* =============================
         채팅 모드
      ============================== */

      else {


        document.body.classList.remove(
          'graph-mode'
        );


        button.textContent =
          'Graph';


      }


    }

  );

}



/* =====================================================
   YouTube 동접자 API
====================================================== */

async function updateViewers() {


  const endpoint =

    `https://www.googleapis.com/youtube/v3/videos` +

    `?part=liveStreamingDetails` +

    `&id=${VIDEO_IDS.join(',')}` +

    `&key=${API_KEY}`;



  try {


    const response =

      await fetch(endpoint);



    if (!response.ok) {


      throw new Error(

        `HTTP ${response.status}`

      );


    }



    const data =

      await response.json();



    const viewerMap = {};



    (data.items || []).forEach(

      item => {


        const raw =

          item
            ?.liveStreamingDetails
            ?.concurrentViewers;



        /*
          API에서 정상적인 동접자 값이
          반환된 경우에만 사용

          순간적으로 값이 누락되면
          0명으로 바꾸지 않음
        */

        if (

          raw !== undefined &&

          raw !== null

        ) {


          viewerMap[item.id] =

            Number(raw);


        }


      }

    );



    const now =

      new Date();



    VIDEO_IDS.forEach(

      (vid, index) => {


        /*
          이번 API 응답에
          동접자 값이 없다면

          기존 표시값 유지
        */

        if (

          viewerMap[vid] ===
          undefined

        ) {


          return;


        }



        const viewers =

          viewerMap[vid];



        updateViewerText(

          index,

          viewers

        );



        addHistoryPoint(

          index,

          now,

          viewers

        );


      }

    );



    /*
      Graph 화면을 보고 있지 않아도
      데이터는 계속 쌓이고
      그래프도 갱신
    */

    refreshCharts();


  }


  catch (error) {


    console.error(

      '동접자 집계 오류:',

      error

    );


  }

}



/* =====================================================
   상단 동접자 숫자
====================================================== */

function updateViewerText(

  index,

  viewers

) {


  const el =

    document.getElementById(

      `viewers${index + 1}`

    );



  if (!el) {

    return;

  }



  el.textContent =

    viewers.toLocaleString(
      'ko-KR'
    );

}



/* =====================================================
   그래프 데이터 저장
====================================================== */

function addHistoryPoint(

  channelIndex,

  time,

  value

) {


  const list =

    historyData[
      channelIndex
    ];



  list.push({

    time: time,

    value: value

  });



  /* =============================
     1시간 이전 데이터 삭제
  ============================== */

  const cutoff =

    time.getTime() -

    HISTORY_DURATION;



  while (

    list.length > 0 &&

    list[0]
      .time
      .getTime() < cutoff

  ) {


    list.shift();


  }



  /* =============================
     최대 180개 제한
  ============================== */

  while (

    list.length >
    MAX_POINTS

  ) {


    list.shift();


  }

}



/* =====================================================
   시간 표시
====================================================== */

function formatTime(date) {


  return date.toLocaleTimeString(

    'ko-KR',

    {

      hour:
        '2-digit',

      minute:
        '2-digit',

      second:
        '2-digit',

      hour12:
        false

    }

  );

}



/* =====================================================
   Chart.js 공통 설정
====================================================== */

function getCommonChartOptions() {


  return {


    responsive:
      true,


    maintainAspectRatio:
      false,


    animation:
      false,


    interaction: {

      mode:
        'index',

      intersect:
        false

    },


    plugins: {


      legend: {

        labels: {

          color:
            '#dddddd',

          usePointStyle:
            true,

          boxWidth:
            8

        }

      },


      tooltip: {


        callbacks: {


          label:
            function(context) {


              const value =

                context.parsed.y ??
                0;


              return (

                `${context.dataset.label}: ` +

                `${value.toLocaleString('ko-KR')}명`

              );


            }


        }


      }


    },


    scales: {


      x: {


        ticks: {

          color:
            '#aaaaaa',

          maxTicksLimit:
            7

        },


        grid: {

          color:
            'rgba(255,255,255,0.07)'

        },


        title: {

          display:
            true,

          text:
            '시간',

          color:
            '#bbbbbb'

        }


      },


      y: {


        ticks: {


          color:
            '#aaaaaa',


          callback:
            function(value) {


              return Number(value)
                .toLocaleString(
                  'ko-KR'
                );


            }


        },


        grid: {

          color:
            'rgba(255,255,255,0.08)'

        },


        title: {

          display:
            true,

          text:
            '동접자 수',

          color:
            '#bbbbbb'

        }


      }


    }


  };

}



/* =====================================================
   그래프 생성
====================================================== */

function createCharts() {


  /* ===================================================
     한국경제TV 단독
  ==================================================== */

  const ctx1 =

    document
      .getElementById(
        'hankyungChart'
      )
      .getContext('2d');



  hankyungChart =

    new Chart(

      ctx1,

      {


        type:
          'line',


        data: {


          labels: [],


          datasets: [


            {


              label:
                '한국경제TV',


              data: [],


              borderColor:
                '#62e98b',


              backgroundColor:
                'rgba(98,233,139,0.10)',


              borderWidth:
                2,


              pointRadius:
                2,


              pointHoverRadius:
                5,


              tension:
                0.2,


              fill:
                true


            }


          ]


        },


        options:

          getCommonChartOptions()


      }

    );



  /* ===================================================
     3채널 통합
  ==================================================== */

  const ctx2 =

    document
      .getElementById(
        'combinedChart'
      )
      .getContext('2d');



  combinedChart =

    new Chart(

      ctx2,

      {


        type:
          'line',


        data: {


          labels: [],


          datasets: [


            /* 한국경제TV */

            {


              label:
                '한국경제TV',


              data: [],


              borderColor:
                '#62e98b',


              backgroundColor:
                '#62e98b',


              borderWidth:
                2,


              pointRadius:
                2,


              tension:
                0.2,


              fill:
                false


            },



            /* MTN */

            {


              label:
                'MTN',


              data: [],


              borderColor:
                '#4d8cff',


              backgroundColor:
                '#4d8cff',


              borderWidth:
                2,


              pointRadius:
                2,


              tension:
                0.2,


              fill:
                false


            },



            /* 매일경제TV */

            {


              label:
                '매일경제TV',


              data: [],


              borderColor:
                '#ff934d',


              backgroundColor:
                '#ff934d',


              borderWidth:
                2,


              pointRadius:
                2,


              tension:
                0.2,


              fill:
                false


            }


          ]


        },


        options:

          getCommonChartOptions()


      }

    );

}



/* =====================================================
   전체 그래프 갱신
====================================================== */

function refreshCharts() {


  if (

    !hankyungChart ||

    !combinedChart

  ) {


    return;


  }



  refreshHankyungChart();


  refreshCombinedChart();

}



/* =====================================================
   한국경제TV 단독 그래프

   현재 동접자 기준

   -1,000명
       ~
   +1,000명
====================================================== */

function refreshHankyungChart() {


  const list =

    historyData[0];



  if (

    list.length === 0

  ) {


    return;


  }



  const current =

    list[
      list.length - 1
    ].value;



  /*
    현재 동접자 -1000

    실제 동접자가 1000명보다 적다면
    그래프 하한만 0으로 제한
  */

  const yMin =

    Math.max(

      0,

      current - 1000

    );



  const yMax =

    current + 1000;



  hankyungChart
    .data
    .labels =

      list.map(

        item =>
          formatTime(
            item.time
          )

      );



  hankyungChart
    .data
    .datasets[0]
    .data =

      list.map(

        item =>
          item.value

      );



  hankyungChart
    .options
    .scales
    .y
    .min =

      yMin;



  hankyungChart
    .options
    .scales
    .y
    .max =

      yMax;



  hankyungChart.update(
    'none'
  );



  /* 현재 동접자 표시 */

  const currentText =

    document.getElementById(
      'hankyungCurrent'
    );



  currentText.textContent =

    `현재 ` +

    `${current.toLocaleString('ko-KR')}명 ` +

    `(±1,000)`;

}



/* =====================================================
   3개 채널 통합 그래프
====================================================== */

function refreshCombinedChart() {


  /*
    세 채널은 한 번의 API 호출에서
    동시에 가져오기 때문에

    한국경제TV 데이터의 시간을
    공통 X축으로 사용
  */

  const base =

    historyData[0];



  if (

    base.length === 0

  ) {


    return;


  }



  combinedChart
    .data
    .labels =

      base.map(

        item =>
          formatTime(
            item.time
          )

      );



  /* 한국경제TV */

  combinedChart
    .data
    .datasets[0]
    .data =

      historyData[0]
        .map(

          item =>
            item.value

        );



  /* MTN */

  combinedChart
    .data
    .datasets[1]
    .data =

      historyData[1]
        .map(

          item =>
            item.value

        );



  /* 매일경제TV */

  combinedChart
    .data
    .datasets[2]
    .data =

      historyData[2]
        .map(

          item =>
            item.value

        );



  /*
    통합 그래프는
    세 채널 값에 맞춰
    Y축 자동 조정
  */

  delete combinedChart
    .options
    .scales
    .y
    .min;


  delete combinedChart
    .options
    .scales
    .y
    .max;



  combinedChart.update(
    'none'
  );

}
